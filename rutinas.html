<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAH FIT | Rutinas</title>
  <link rel="stylesheet" href="styles.css"/>

  <style>
    /* ==========================
       RUTINAS BUILDER (UI)
       (Tu esencia original)
       ========================== */
    :root{
      --bg0:#0a0e14;
      --bg1:#0f1623;
      --card:#121b2a;
      --line:rgba(255,255,255,.10);
      --txt:rgba(255,255,255,.88);
      --mut:rgba(255,255,255,.65);
      --ok:#2bd576;
      --bad:#ff5a67;
      --pri:#7c5cff;
      --pri2:#23a6ff;
      --chip:#1a2538;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:16px;
    }
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg0),var(--bg1));
      color:var(--txt);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      min-height:100vh;
    }
    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:18px;
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter: blur(8px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .logo{
      width:38px;height:38px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--pri),var(--pri2));
      box-shadow:0 8px 18px rgba(124,92,255,.25);
    }
    h1{
      margin:0;
      font-size:18px;
      letter-spacing:.4px;
    }
    .pill{
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      color:var(--mut);
      font-size:12px;
    }
    .grid{
      display:grid;
      grid-template-columns: 420px 1fr;
      gap:16px;
      margin-top:16px;
    }
    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
    }
    .card{
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
    }
    .card h2{
      margin:0 0 10px 0;
      font-size:14px;
      color:rgba(255,255,255,.92);
      letter-spacing:.4px;
    }
    .row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    label{
      font-size:12px;
      color:var(--mut);
      display:block;
      margin-bottom:4px;
    }
    input, select, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.20);
      color:var(--txt);
      outline:none;
    }
    textarea{ min-height:90px; resize:vertical; }
    .col{
      flex:1;
      min-width:160px;
    }
    .btn{
      border:none;
      cursor:pointer;
      border-radius:12px;
      padding:10px 12px;
      color:#fff;
      font-weight:600;
      background:linear-gradient(135deg,var(--pri),var(--pri2));
      box-shadow:0 10px 20px rgba(35,166,255,.15);
      transition:transform .06s ease;
    }
    .btn:active{ transform:scale(.98); }
    .btn.ghost{
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      box-shadow:none;
      color:rgba(255,255,255,.85);
    }
    .btn.danger{
      background:rgba(255,90,103,.12);
      border:1px solid rgba(255,90,103,.35);
      color:#ffd8dc;
      box-shadow:none;
    }
    .btn.small{ padding:7px 10px; border-radius:10px; font-size:12px; }
    .hr{
      height:1px;
      background:var(--line);
      margin:10px 0;
    }
    .notice{
      padding:10px 12px;
      border-radius:12px;
      background:rgba(255,255,255,.05);
      border:1px dashed rgba(255,255,255,.14);
      color:rgba(255,255,255,.75);
      font-size:12px;
    }
    .daysArea{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .dayCard{
      background:rgba(0,0,0,.18);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:12px;
      position:relative;
    }
    .dayHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .dayTitle{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:700;
      letter-spacing:.3px;
    }
    .dayBadges{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .chip{
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      color:rgba(255,255,255,.78);
      padding:4px 8px;
      border-radius:999px;
      font-size:11px;
    }
    .chip.on{
      background:rgba(43,213,118,.14);
      border-color:rgba(43,213,118,.35);
      color:#d9ffe9;
    }
    .focusGrid{
      display:grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap:10px;
      padding:10px;
      border-radius:14px;
      background:rgba(255,255,255,.03);
      border:1px solid var(--line);
      margin-bottom:12px;
    }
    @media (max-width: 980px){
      .focusGrid{ grid-template-columns: repeat(3, 1fr); }
    }
    .focusItem{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      color:rgba(255,255,255,.78);
      user-select:none;
    }
    .focusItem input{ width:auto; }
    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0 8px;
      font-size:12px;
    }
    th{
      color:rgba(255,255,255,.55);
      font-weight:600;
      text-align:left;
      padding:0 8px;
      font-size:11px;
    }
    td{
      padding:10px 8px;
      background:rgba(255,255,255,.03);
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
    }
    td:first-child{
      border-left:1px solid var(--line);
      border-top-left-radius:14px;
      border-bottom-left-radius:14px;
    }
    td:last-child{
      border-right:1px solid var(--line);
      border-top-right-radius:14px;
      border-bottom-right-radius:14px;
    }
    .tblInput{
      width:100%;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.15);
      color:rgba(255,255,255,.88);
      outline:none;
      font-size:12px;
    }
    .tblSmall{ max-width:90px; }
    .tblMid{ max-width:130px; }
    .tblBig{ min-width:160px; }
    .rightCol{
      display:flex;
      flex-direction:column;
      gap:16px;
    }
    .preview{
      display:none;
      margin-top:12px;
      padding:12px;
      border-radius:16px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.22);
      white-space:pre-wrap;
      color:rgba(255,255,255,.84);
      font-size:12px;
      line-height:1.45;
    }
    .footerBtns{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <h1>Constructor de Rutinas</h1>
          <div class="pill">MAH FIT · Guardado Online (Sheets)</div>
        </div>
      </div>
      <div class="row" style="margin:0">
        <button class="btn ghost small" id="btnVolver">Volver</button>
        <button class="btn danger small" id="btnLogout">Salir</button>
      </div>
    </div>

    <div class="grid">
      <!-- ===== Left: datos rutina ===== -->
      <div class="card">
        <h2>Datos de la Rutina</h2>

        <div class="row">
          <div class="col">
            <label>Socio</label>
            <input id="socioSearch" placeholder="Buscar socio por nombre o RUT..." />
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label>Selecciona Socio</label>
            <select id="socioSelect"></select>
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label>Nivel</label>
            <select id="nivel">
              <option value="Principiante">Principiante</option>
              <option value="Intermedio">Intermedio</option>
              <option value="Avanzado">Avanzado</option>
            </select>
          </div>
          <div class="col">
            <label>Objetivo</label>
            <select id="objetivo">
              <option value="Hipertrofia">Hipertrofia</option>
              <option value="Fuerza">Fuerza</option>
              <option value="Pérdida de grasa">Pérdida de grasa</option>
              <option value="Rendimiento">Rendimiento</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label>Fecha (opcional)</label>
            <input id="fecha" placeholder="Ej: 2026-01-10" />
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label>Notas (opcional)</label>
            <textarea id="notas" placeholder="Indicaciones generales, técnica, RIR, etc."></textarea>
          </div>
        </div>

        <div class="hr"></div>

        <h2>Agregar Días</h2>
        <div class="row">
          <div class="col" style="max-width:120px">
            <label>Día</label>
            <select id="dayPicker">
              <option value="1">Día 1</option>
              <option value="2">Día 2</option>
              <option value="3">Día 3</option>
              <option value="4">Día 4</option>
              <option value="5">Día 5</option>
              <option value="6">Día 6</option>
              <option value="7">Día 7</option>
            </select>
          </div>
          <div class="col" style="max-width:180px; align-self:flex-end;">
            <button class="btn" id="btnAddDay">Agregar día</button>
          </div>
        </div>

        <div class="notice">
          <b>Tip:</b> define el <b>Enfoque</b> por día (músculos principales) y agrega ejercicios con series/reps/carga/descanso.
        </div>

        <div class="hr"></div>

        <h2>Acciones</h2>
        <div class="footerBtns">
          <button class="btn" id="btnGuardar">Guardar Rutina</button>
          <button class="btn ghost" id="btnVista">Vista Socio</button>
        </div>
        <p id="msg" style="margin:10px 0 0 0; font-size:12px; color:rgba(255,255,255,.75)"></p>

        <div class="preview" id="previewBox"></div>

        <div class="hr"></div>

        <h2>Última rutina guardada</h2>
        <div class="notice" id="lastRoutineBox">No hay rutina guardada aún.</div>
      </div>

      <!-- ===== Right: días/exercises ===== -->
      <div class="rightCol">
        <div class="card">
          <h2>Días de entrenamiento</h2>
          <div class="daysArea" id="daysContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>

  <script>
    // ==========================================================
    // Tu base de ejercicios (tal cual la tenías)
    // ==========================================================
    const EXERCISE_DB = {
      "Pectoral": ["Press banca inclinada Smith","Press banca Smith","Press banca plano (barra)","Press banca plano (mancuernas)","Press banca plano (discos)","Press banca inclinado (barra)","Press banca inclinado (mancuernas)","Press banca declinado (barra)","Press banca declinado (mancuernas)","Press banca con agarre estrecho","Press banca en máquina","Press banca en máquina inclinada","Press banca en máquina declinada","Press banca en polea","Press banca en multipower","Press banca en multipower inclinado","Press banca en multipower declinado","Press en máquina hammer","Press en máquina hammer inclinado","Press en máquina hammer declinado","Press en máquina convergente","Press en máquina convergente inclinado","Press en máquina convergente declinado"],
      "Espalda": ["Remo con barra","Remo con mancuerna","Remo en máquina","Remo sentado en polea","Jalón al pecho","Dominadas","Pullover en polea","Remo T","Remo en máquina hammer","Remo en multipower"],
      "Dorsales": ["Jalón al pecho agarre ancho","Jalón al pecho agarre estrecho","Jalón tras nuca (si aplica)","Dominadas asistidas","Dominadas libres"],
      "Hombros": ["Press militar","Press militar con mancuernas","Elevaciones laterales","Elevaciones frontales","Pájaros","Face pull","Press Arnold"],
      "Bíceps": ["Curl bíceps barra","Curl bíceps mancuernas","Curl martillo","Curl concentrado","Curl en polea"],
      "Tríceps": ["Fondos","Extensión en polea","Press francés","Patada tríceps","Extensión por encima de la cabeza"],
      "Cuádriceps": ["Sentadilla","Prensa","Extensión de cuádriceps","Zancadas","Hack squat"],
      "Isquiotibiales": ["Peso muerto rumano","Curl femoral","Buenos días","Peso muerto piernas rígidas"],
      "Glúteos": ["Hip thrust","Patada glúteo","Abducción de cadera","Puente glúteo","Sentadilla sumo"],
      "Aductores/Abductores": ["Aductores máquina","Abductores máquina"],
      "Pantorrillas": ["Elevación de talones de pie","Elevación de talones sentado"],
      "Abdominales/Core": ["Plancha","Crunch","Elevación de piernas","Russian twist"],
      "Cardio": ["Cinta","Bicicleta","Elíptica","Remo","Escaladora"]
    };

    const MUSCLES = Object.keys(EXERCISE_DB);

    // ==========================================================
    // Templates
    // ==========================================================
    function dayCardTemplate(dayNum){
      return `
        <div class="dayCard" data-day="${dayNum}">
          <div class="dayHead">
            <div class="dayTitle">
              <span>DÍA ${dayNum}</span>
              <div class="dayBadges" id="badges-${dayNum}">
                <span class="chip">Enfocado</span>
              </div>
            </div>
            <div class="row" style="margin:0">
              <button class="btn ghost small" data-addex="${dayNum}">+ Ejercicio</button>
              <button class="btn danger small" data-removeday="${dayNum}">Quitar Día</button>
            </div>
          </div>

          <div class="notice" style="margin-bottom:10px">
            <b>Enfocado</b><br/>
            Selecciona uno o más músculos para el enfoque del día.
          </div>

          <div class="focusGrid" id="focus-${dayNum}">
            ${MUSCLES.map(m => `
              <label class="focusItem">
                <input type="checkbox" data-focus="${dayNum}" value="${m}"/>
                <span>${m}</span>
              </label>
            `).join("")}
          </div>

          <table>
            <thead>
              <tr>
                <th>MÚSCULO</th>
                <th>EJERCICIO</th>
                <th>N° MAQ/VAR</th>
                <th>OBS.</th>
                <th>SERIES</th>
                <th>REPS</th>
                <th>CARGA</th>
                <th>DESCANSO</th>
                <th>ACCIÓN</th>
              </tr>
            </thead>
            <tbody id="tbody-${dayNum}"></tbody>
          </table>
        </div>
      `;
    }

    function rowTemplate(dayNum){
      const muscleOptions = MUSCLES.map(m => `<option value="${m}">${m}</option>`).join("");
      return `
        <tr>
          <td>
            <select class="tblInput tblBig" data-muscle="${dayNum}">
              ${muscleOptions}
            </select>
          </td>
          <td>
            <input class="tblInput tblBig" list="dl-${dayNum}" placeholder="Escribe o elige" data-ex="${dayNum}"/>
            <datalist id="dl-${dayNum}"></datalist>
          </td>
          <td><input class="tblInput tblSmall" placeholder="N° maq / variante" data-maq="${dayNum}"/></td>
          <td><input class="tblInput tblMid" placeholder="Técnica / tempo / RIR.." data-obs="${dayNum}"/></td>
          <td><input class="tblInput tblSmall" placeholder="3" data-series="${dayNum}"/></td>
          <td><input class="tblInput tblSmall" placeholder="8-12" data-reps="${dayNum}"/></td>
          <td><input class="tblInput tblSmall" placeholder="kg" data-carga="${dayNum}"/></td>
          <td><input class="tblInput tblSmall" placeholder="Ej: 1:30" data-desc="${dayNum}"/></td>
          <td><button class="btn ghost small" data-delrow="${dayNum}">Quitar</button></td>
        </tr>
      `;
    }

    // ==========================================================
    // Helpers UI
    // ==========================================================
    function updateDatalist(dayNum, muscle){
      const dl = document.getElementById(`dl-${dayNum}`);
      if(!dl) return;
      dl.innerHTML = (EXERCISE_DB[muscle] || []).map(ex => `<option value="${ex}"></option>`).join("");
    }

    function updateFocusBadges(dayNum){
      const box = document.getElementById(`badges-${dayNum}`);
      const checked = [...document.querySelectorAll(`input[data-focus="${dayNum}"]:checked`)].map(x=>x.value);
      if(!box) return;

      if(checked.length === 0){
        box.innerHTML = `<span class="chip">Enfocado</span>`;
        return;
      }
      box.innerHTML = checked.map(m=>`<span class="chip on">${m}</span>`).join("");
    }

    function wireDayActions(){
      // botones por día
      document.querySelectorAll("[data-addex]").forEach(btn=>{
        btn.onclick = ()=>{
          const d = btn.getAttribute("data-addex");
          document.querySelector(`#tbody-${d}`).insertAdjacentHTML("beforeend", rowTemplate(d));
          wireRowActions(d);
        };
      });

      document.querySelectorAll("[data-removeday]").forEach(btn=>{
        btn.onclick = ()=>{
          const d = btn.getAttribute("data-removeday");
          const card = document.querySelector(`.dayCard[data-day="${d}"]`);
          if(card) card.remove();
          addedDays.delete(String(d));
        };
      });

      // enfoque badges
      document.querySelectorAll("input[data-focus]").forEach(ch=>{
        ch.onchange = ()=>{
          const d = ch.getAttribute("data-focus");
          updateFocusBadges(d);
        };
      });
    }

    function wireRowActions(dayNum){
      // borrar fila
      document.querySelectorAll(`[data-delrow="${dayNum}"]`).forEach(btn=>{
        btn.onclick = ()=>{
          btn.closest("tr")?.remove();
        };
      });

      // cambio músculo => actualiza datalist
      document.querySelectorAll(`select[data-muscle="${dayNum}"]`).forEach(sel=>{
        sel.onchange = ()=>{
          updateDatalist(dayNum, sel.value);
        };
        // init datalist con el primer músculo
        updateDatalist(dayNum, sel.value);
      });
    }

    // ==========================================================
    // Data builder (collect routine)
    // ==========================================================
    function collectRoutine(){
      const socioVal = $("#socioSelect").value;
      const socio = getUsers().find(u=>u.rut === socioVal);
      if(!socio) throw new Error("Selecciona un socio válido.");

      const meta = {
        nivel: $("#nivel").value,
        objetivo: $("#objetivo").value,
        fecha: $("#fecha").value || "",
        notas: $("#notas").value || ""
      };

      const dias = [];
      document.querySelectorAll(".dayCard").forEach(card=>{
        const d = card.getAttribute("data-day");
        const enfoque = [...document.querySelectorAll(`input[data-focus="${d}"]:checked`)].map(x=>x.value);

        const ejercicios = [];
        const tbody = document.getElementById(`tbody-${d}`);
        [...tbody.querySelectorAll("tr")].forEach(tr=>{
          const musculo = tr.querySelector(`select[data-muscle="${d}"]`)?.value || "";
          const ejercicio = tr.querySelector(`input[data-ex="${d}"]`)?.value || "";
          const maq = tr.querySelector(`input[data-maq="${d}"]`)?.value || "";
          const obs = tr.querySelector(`input[data-obs="${d}"]`)?.value || "";
          const series = tr.querySelector(`input[data-series="${d}"]`)?.value || "";
          const reps = tr.querySelector(`input[data-reps="${d}"]`)?.value || "";
          const carga = tr.querySelector(`input[data-carga="${d}"]`)?.value || "";
          const descanso = tr.querySelector(`input[data-desc="${d}"]`)?.value || "";

          if(musculo && ejercicio){
            ejercicios.push({ musculo, ejercicio, maq, obs, series, reps, carga, descanso });
          }
        });

        dias.push({
          dia: `Día ${d}`,
          enfoque,
          ejercicios
        });
      });

      if(dias.length === 0) throw new Error("Debes agregar al menos 1 día.");

      return {
        socio: { rut: socio.rut, nombre: socio.nombre },
        meta,
        dias
      };
    }

    function formatRutinaText(routine, profName){
      let out = "";
      out += `RUTINA DE ENTRENAMIENTO\\n`;
      out += `Socio: ${routine.socio.nombre} (${routine.socio.rut})\\n`;
      out += `Nivel: ${routine.meta.nivel}\\n`;
      out += `Objetivo: ${routine.meta.objetivo}\\n`;
      if(routine.meta.fecha) out += `Fecha: ${routine.meta.fecha}\\n`;
      if(routine.meta.notas) out += `Notas: ${routine.meta.notas}\\n`;
      out += `Profesor: ${profName}\\n`;
      out += `\\n==============================\\n\\n`;

      routine.dias.forEach(day=>{
        out += `${day.dia}\\n`;
        if(day.enfoque?.length) out += `Enfoque: ${day.enfoque.join(" + ")}\\n`;
        out += `\\n`;
        day.ejercicios.forEach((e, i)=>{
          out += `${i+1}. ${e.musculo} - ${e.ejercicio} | Series: ${e.series} | Reps: ${e.reps} | Carga: ${e.carga} | Desc: ${e.descanso}\\n`;
          if(e.maq) out += `   Maq/Var: ${e.maq}\\n`;
          if(e.obs) out += `   Obs: ${e.obs}\\n`;
        });
        out += `\\n------------------------------\\n\\n`;
      });

      return out;
    }

    function showLastRoutineBox(last){
      const box = $("#lastRoutineBox");
      if(!last){
        box.textContent = "No hay rutina guardada aún.";
        return;
      }
      box.innerHTML = `
        <b>${last.titulo}</b><br/>
        <span style="opacity:.75">RUT: ${last.rutSocio}</span><br/>
        <span style="opacity:.75">Actualizado: ${new Date(last.creadoEn).toLocaleString()}</span>
      `;
    }

    function filterSocios(q){
      q = String(q||"").toLowerCase().trim();
      const users = getUsers().filter(u=>u.rol==="SOCIO" && u.activo !== false);
      if(!q) return users;
      return users.filter(u =>
        (u.nombre||"").toLowerCase().includes(q) ||
        (u.rut||"").toLowerCase().includes(q)
      );
    }

    // ==========================================================
    // Main
    // ==========================================================
    const addedDays = new Set();

    document.addEventListener("DOMContentLoaded", ()=>{
      // Auth (funcionario)
      let me = requireAuth("FUNCIONARIO");
      if(!me) return;

      // Volver
      $("#btnVolver").onclick = ()=> window.location.href = "funcionario.html";
      $("#btnLogout").onclick = ()=>{
        localStorage.removeItem("mahfit_session");
        window.location.href = "index.html";
      };

      // Poblar socios
      const socioSelect = $("#socioSelect");
      const search = $("#socioSearch");

      function renderSocios(list){
        socioSelect.innerHTML = "";
        list.forEach(u=>{
          const opt = document.createElement("option");
          opt.value = u.rut;
          opt.textContent = `${u.nombre} (${u.rut})`;
          socioSelect.appendChild(opt);
        });
      }

      renderSocios(filterSocios(""));

      search.addEventListener("input", ()=>{
        renderSocios(filterSocios(search.value));
      });

      search.addEventListener("keydown", (e)=>{
        if(e.key==="Enter") e.preventDefault();
      });

      // Agregar día
      $("#btnAddDay").onclick = ()=>{
        const d = String($("#dayPicker").value);
        if(addedDays.has(d)){
          showMsg($("#msg"), `⚠️ Día ${d} ya está agregado.`, false);
          return;
        }
        $("#daysContainer").insertAdjacentHTML("beforeend", dayCardTemplate(d));
        addedDays.add(d);
        wireDayActions();
        updateFocusBadges(d);
        showMsg($("#msg"), `Agregado: Día ${d}`, true);
      };

      // Día 1 por defecto
      $("#dayPicker").value = "1";
      $("#btnAddDay").click();

      $("#btnGuardar").onclick = ()=>{
        try{
          const routine = collectRoutine();

          // ✅ Guardar también como base de datos (1 fila por ejercicio)
          //    (historial por rutina)
          const rutinaId = crypto.randomUUID();
          apiPost("RUTINAS_ITEMS", {
            rutinaId,
            routine,
            profesorRut: me.rut,
            profesorNombre: me.nombre
          }).catch(console.error);

          upsertRutinaV2({
            rutSocio: routine.socio.rut,
            routine,
            creadoPorRut: me.rut
          });

          const txt = formatRutinaText(routine, me.nombre);
          upsertRutina({
            rutSocio: routine.socio.rut,
            titulo: `Rutina ${routine.meta.nivel} (${routine.dias.length} días)`,
            detalle: txt,
            creadoPorRut: me.rut
          });

          showLastRoutineBox(rutinaV2DeSocio(routine.socio.rut));
          showMsg($("#msg"), "✅ Rutina guardada. El socio ya la puede ver en su panel.", true);
        }catch(err){
          showMsg($("#msg"), err.message, false);
        }
      };

      // ✅ VISUALIZAR RUTINA (como lo verá el SOCIO)
      $("#btnVista").onclick = ()=>{
        try{
          const routine = collectRoutine();
          const box = $("#previewBox");
          box.style.display = "block";
          box.textContent = formatRutinaText(routine, me.nombre);
        }catch(err){
          showMsg($("#msg"), err.message, false);
        }
      };

      // Mostrar última (si existe local)
      const s = socioSelect.value;
      if(s){
        const last = rutinaDeSocio(s);
        if(last) showLastRoutineBox(last);
      }
    });
  </script>
</body>
</html>
