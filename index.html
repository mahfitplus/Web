<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAH FIT | Inicio</title>

  <!-- CSS principal -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- =======================
       HEADER / TOP BAR
  ======================== -->
  <header class="topbar">
    <div class="topbar-left">
      <h1 class="logo">MAH <span>FIT</span></h1>
    </div>

    <!-- INDICADOR CONEXIÓN -->
    <div class="db-status" id="dbStatus">
      <span class="db-dot connecting" id="dbDot"></span>
      <span class="db-text" id="dbText">Conectando…</span>
    </div>
  </header>

  <!-- =======================
       CONTENIDO PRINCIPAL
  ======================== -->
  <main class="container">
    <h2>Panel Principal</h2>

    <div class="cards">
      <a href="socio.html" class="card">Socios</a>
      <a href="rutinas.html" class="card">Rutinas</a>
      <a href="ejercicios.html" class="card">Ejercicios</a>
      <a href="funcionario.html" class="card">Funcionarios</a>
    </div>
  </main>

  <!-- =======================
       JS
  ======================== -->
  <script src="app.js"></script>

  <script>
    // Función visual del estado
    function setDbStatus(status) {
      const dot = document.getElementById("dbDot");
      const text = document.getElementById("dbText");

      dot.className = "db-dot";

      if (status === "connected") {
        dot.classList.add("connected");
        text.textContent = "Conectado";
      } else if (status === "error") {
        dot.classList.add("error");
        text.textContent = "Sin conexión";
      } else {
        dot.classList.add("connecting");
        text.textContent = "Conectando…";
      }
    }

    // Hook al sistema
    document.addEventListener("DOMContentLoaded", async () => {
      setDbStatus("connecting");

      try {
        if (typeof syncDown === "function") {
          await syncDown();   // conexión a Sheets / Excel
          setDbStatus("connected");
        } else {
          throw new Error("syncDown no existe");
        }
      } catch (e) {
        console.error("Error conexión DB:", e);
        setDbStatus("error");
      }
    });
  </script>

</body>
</html>
