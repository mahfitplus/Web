<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAH FIT | Funcionario (CRM)</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body data-page="funcionario">
  <header class="topbar">
    <div class="brand"><span class="mah">MAH</span> <span class="fit">FIT</span></div>
    <div class="nav-right">
      <span>Hola, <b id="who"></b></span>
      <span id="roleBadge" class="badge"></span>
      <a class="btn primary small" href="/rutinas.html">Crear rutina</a>
      <button id="btnLogout" class="btn ghost small">Salir</button>
    </div>
  </header>

  <main class="hero">
    <div class="container">

      <div class="kpi">
        <div class="box">
          <div style="color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;">Socios</div>
          <b id="kSocios">0</b>
        </div>
        <div class="box">
          <div style="color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;">Funcionarios</div>
          <b id="kFunc">0</b>
        </div>
        <div class="box">
          <div style="color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;">Activos</div>
          <b id="kActivos">0</b>
        </div>
      </div>

      <div style="height:18px;"></div>

      <div class="card">
        <div class="head">
          <strong>CRM Usuarios</strong>
          <span class="pill">Crear / Activar / Desactivar</span>
        </div>
        <div class="body">
          <table class="table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>RUT/Usuario</th>
                <th>Rol</th>
                <th>Activo</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="usersTbody"></tbody>
          </table>
        </div>
      </div>

      <div style="height:18px;"></div>

      <div class="card">
        <div class="head"><strong>Crear usuario</strong><span class="pill">Solo admin</span></div>
        <div class="body">
          <form id="createUserForm" class="form">
            <div class="split">
              <div>
                <label>RUT/Usuario</label>
                <input id="newRut" class="input" placeholder="Ej: 12345678-9" />
              </div>
              <div>
                <label>Nombre</label>
                <input id="newNombre" class="input" placeholder="Nombre completo" />
              </div>
            </div>

            <div class="split">
              <div>
                <label>Email (opcional)</label>
                <input id="newEmail" class="input" placeholder="correo@..." />
              </div>
              <div>
                <label>Clave</label>
                <input id="newPass" class="input" placeholder="Clave" />
              </div>
            </div>

            <label>Rol</label>
            <select id="newRol" class="select input">
              <option value="SOCIO">SOCIO</option>
              <option value="FUNCIONARIO">FUNCIONARIO</option>
            </select>

            <button class="btn primary" type="submit" style="margin-top:14px;">CREAR</button>
            <div id="msgUser" style="margin-top:10px;font-size:13px;"></div>
          </form>
        </div>
      </div>

    </div>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
