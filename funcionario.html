<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAH FIT | Funcionario</title>
  <link rel="stylesheet" href="styles.css"/>

  <style>
    :root{
      --bg:#070a11;
      --panel: rgba(255,255,255,.05);
      --panel2: rgba(0,0,0,.25);
      --stroke: rgba(255,255,255,.10);
      --stroke2: rgba(255,255,255,.14);
      --txt: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);
      --brand: #4d7cff;
      --brand2:#23a6ff;
      --ok:#2bd576;
      --bad:#ff5a67;
      --shadow: 0 14px 50px rgba(0,0,0,.45);
      --radius: 18px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:
        radial-gradient(1200px 600px at 35% 25%, rgba(77,124,255,.22), transparent 60%),
        radial-gradient(900px 500px at 80% 35%, rgba(35,166,255,.18), transparent 60%),
        linear-gradient(180deg, #05070b, #070a11 45%, #070a11);
      color:var(--txt);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      min-height:100vh;
    }

    /* Topbar */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:14px 18px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background:rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
      position:sticky;
      top:0;
      z-index:50;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 240px;
    }
    .brandTitle{
      font-weight:900;
      letter-spacing:.5px;
      font-size:22px;
    }
    .brandTitle span{ color:#6fe0ff; }

    .rightTop{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .hello{ color:rgba(255,255,255,.85); }
    .hello b{ color:#fff; }

    .badge{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.85);
      font-size:12px;
      letter-spacing:.2px;
    }

    .btn{
      border:none;
      cursor:pointer;
      border-radius:12px;
      padding:10px 14px;
      color:#fff;
      font-weight:700;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      box-shadow:0 10px 22px rgba(35,166,255,.18);
      transition: transform .06s ease, filter .15s ease;
      user-select:none;
    }
    .btn:hover{ filter:brightness(1.05); }
    .btn:active{ transform:scale(.985); }
    .btn.ghost{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:none;
      color:rgba(255,255,255,.9);
    }
    .btn.danger{
      background:rgba(255,90,103,.14);
      border:1px solid rgba(255,90,103,.35);
      box-shadow:none;
      color:#ffd8dc;
    }
    .btn.small{ padding:7px 10px; border-radius:10px; font-size:12px; }
    .btn.yellow{
      background:linear-gradient(135deg,#f6c11a,#ffdf6f);
      color:#0a0e14;
      box-shadow:0 10px 22px rgba(255,223,111,.18);
    }

    .wrap{
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px;
    }

    /* KPIs */
    .kpis{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:14px;
      margin-top: 14px;
    }
    @media (max-width: 980px){
      .kpis{ grid-template-columns:1fr; }
    }
    .kpi{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.10);
      border-radius:var(--radius);
      box-shadow: var(--shadow);
      padding:14px 16px;
    }
    .kpi .label{
      color:rgba(255,255,255,.70);
      font-size:12px;
      font-weight:800;
      letter-spacing:.4px;
    }
    .kpi .value{
      margin-top:8px;
      font-size:28px;
      font-weight:900;
    }

    /* Sections */
    .section{
      margin-top:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.10);
      border-radius:var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .sectionHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
    .sectionTitle{
      font-weight:900;
      letter-spacing:.4px;
    }
    .hint{
      margin-top:6px;
      color:rgba(255,255,255,.65);
      font-size:12px;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }
    .searchBox, select, input{
      width: 320px;
      max-width: 100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.22);
      color:rgba(255,255,255,.92);
      outline:none;
    }

    /* CRM header row */
    .hdr{
      display:grid;
      grid-template-columns: 2fr 1.2fr .9fr .7fr 1fr;
      gap:10px;
      padding: 8px 10px;
      color:rgba(255,255,255,.55);
      font-weight:800;
      font-size:11px;
      letter-spacing:.35px;
      margin-bottom:8px;
    }
    @media (max-width: 980px){
      .hdr{ display:none; }
    }

    /* ✅ Scroll interno CRM */
    .crmScroll{
      max-height: 420px;
      overflow: auto;
      padding-right: 6px;
      border-radius: 16px;
    }
    .crmScroll::-webkit-scrollbar{ width:10px; }
    .crmScroll::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.12);
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,.2);
    }

    /* Table style (para que app.js meta <tr>) */
    table{ width:100%; }
    #usersTbody tr td{
      background: rgba(0,0,0,.20);
      border-top:1px solid rgba(255,255,255,.10);
      border-bottom:1px solid rgba(255,255,255,.10);
      padding: 12px 10px;
      font-size:13px;
    }
    #usersTbody tr td:first-child{
      border-left:1px solid rgba(255,255,255,.10);
      border-top-left-radius:14px;
      border-bottom-left-radius:14px;
    }
    #usersTbody tr td:last-child{
      border-right:1px solid rgba(255,255,255,.10);
      border-top-right-radius:14px;
      border-bottom-right-radius:14px;
    }

    .pill{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      color:rgba(255,255,255,.88);
      font-size:12px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }

    /* Create user grid */
    .formGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
      margin-top:10px;
    }
    @media (max-width: 980px){
      .formGrid{ grid-template-columns: 1fr; }
    }
    .field label{
      display:block;
      margin: 0 0 6px 0;
      font-size:12px;
      color:rgba(255,255,255,.70);
      font-weight:700;
      letter-spacing:.2px;
    }
    .formActions{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
      margin-top:12px;
      flex-wrap:wrap;
    }
    #msgUser{
      margin-top:10px;
      font-size:12px;
      color:rgba(255,255,255,.75);
    }
  </style>
</head>

<body data-page="funcionario">
  <div class="topbar">
    <div class="brand">
      <div class="brandTitle">MAH <span>FIT</span></div>
    </div>

    <div class="rightTop">
      <div class="hello">Hola, <b id="who">Funcionario</b></div>
      <span class="badge" id="roleBadge">FUNCIONARIO</span>
      <button class="btn yellow" id="btnRutinas">Creador Rutinas</button>
      <button class="btn ghost" id="btnLogout">Salir</button>
    </div>
  </div>

  <div class="wrap">
    <!-- KPIs -->
    <div class="kpis">
      <div class="kpi">
        <div class="label">SOCIOS</div>
        <div class="value" id="kSocios">0</div>
      </div>
      <div class="kpi">
        <div class="label">FUNCIONARIOS</div>
        <div class="value" id="kFunc">0</div>
      </div>
      <div class="kpi">
        <div class="label">ACTIVOS</div>
        <div class="value" id="kActivos">0</div>
      </div>
    </div>

    <!-- ✅ CREAR USUARIO ARRIBA -->
    <div class="section">
      <div class="sectionHead">
        <div>
          <div class="sectionTitle">CREAR USUARIO</div>
          <div class="hint">Solo admin / funcionario</div>
        </div>
      </div>

      <form id="createUserForm">
        <div class="formGrid">
          <div class="field">
            <label>RUT/Usuario</label>
            <input id="newRut" placeholder="Ej: 20228778-6" required />
          </div>
          <div class="field">
            <label>Nombre</label>
            <input id="newNombre" placeholder="Ej: Juan Pérez" required />
          </div>
          <div class="field">
            <label>Email</label>
            <input id="newEmail" type="email" placeholder="correo@..." />
          </div>
          <div class="field">
            <label>Clave</label>
            <input id="newPass" placeholder="1234" required />
          </div>
          <div class="field">
            <label>Rol</label>
            <select id="newRol">
              <option value="SOCIO">SOCIO</option>
              <option value="FUNCIONARIO">FUNCIONARIO</option>
            </select>
          </div>
          <div class="field" style="display:flex;align-items:flex-end;justify-content:flex-end;">
            <button class="btn" type="submit" style="width:100%">Crear</button>
          </div>
        </div>

        <div id="msgUser"></div>
      </form>
    </div>

    <!-- ✅ CRM con barrita -->
    <div class="section">
      <div class="sectionHead">
        <div>
          <div class="sectionTitle">CRM USUARIOS</div>
          <div class="hint">Tip: escribe en el buscador y se filtra altiro.</div>
        </div>

        <div class="toolbar">
          <input id="userSearch" class="searchBox" placeholder="Buscar por nombre, RUT, email, rol o estado..." />
          <select id="roleFilter" style="width:160px">
            <option value="ALL">Todos</option>
            <option value="SOCIO">Socios</option>
            <option value="FUNCIONARIO">Funcionarios</option>
            <option value="ACTIVOS">Activos</option>
            <option value="INACTIVOS">Inactivos</option>
          </select>
        </div>
      </div>

      <div class="hdr">
        <div>NOMBRE</div>
        <div>RUT/USUARIO</div>
        <div>ROL</div>
        <div>ACTIVO</div>
        <div>ACCIONES</div>
      </div>

      <div class="crmScroll">
        <table style="width:100%; border-collapse:separate; border-spacing:0 10px;">
          <tbody id="usersTbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- app.js -->
  <script src="assets/app.js"></script>

  <!-- Extras UI (rutinas + filtros sin tocar app.js) -->
  <script>
    document.addEventListener("DOMContentLoaded", ()=>{
      // ir a rutinas
      const btnRutinas = document.getElementById("btnRutinas");
      if(btnRutinas) btnRutinas.onclick = ()=> window.location.href = "rutinas.html";

      // filtros (ocultan filas ya renderizadas por app.js)
      const search = document.getElementById("userSearch");
      const roleFilter = document.getElementById("roleFilter");

      function norm(v){ return String(v||"").toLowerCase().trim(); }

      function applyFilters(){
        const q = norm(search?.value);
        const f = String(roleFilter?.value || "ALL");

        document.querySelectorAll("#usersTbody tr").forEach(tr=>{
          const name = norm(tr.children?.[0]?.innerText);
          const rut  = norm(tr.children?.[1]?.innerText);
          const rol  = norm(tr.children?.[2]?.innerText);
          const act  = norm(tr.children?.[3]?.innerText); // ✅/⛔

          const hay = `${name} ${rut} ${rol} ${act}`;

          let okRole = true;
          if(f === "SOCIO") okRole = rol.includes("socio");
          if(f === "FUNCIONARIO") okRole = rol.includes("funcionario");
          if(f === "ACTIVOS") okRole = act.includes("✅") || act.includes("activo");
          if(f === "INACTIVOS") okRole = act.includes("⛔") || act.includes("inactivo");

          const okSearch = !q || hay.includes(q);
          tr.style.display = (okRole && okSearch) ? "" : "none";
        });
      }

      search?.addEventListener("input", applyFilters);
      roleFilter?.addEventListener("change", applyFilters);

      // re-aplicar luego de render inicial de app.js
      setTimeout(applyFilters, 200);
      setTimeout(applyFilters, 600);
    });
  </script>
</body>
</html>
