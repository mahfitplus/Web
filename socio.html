<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAH FIT | Socio</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    /* =========================
       SOCIO UI UPGRADE (MAH FIT)
       ========================= */

    :root{
      --glass: rgba(255,255,255,.06);
      --glass2: rgba(0,0,0,.26);
      --stroke: rgba(255,255,255,.10);
      --stroke2: rgba(255,255,255,.14);
      --txt: rgba(255,255,255,.92);
      --mut: rgba(255,255,255,.68);
      --mut2: rgba(255,255,255,.78);

      /* fallback por si no existen en styles.css */
      --ok: rgba(43,213,118,1);
      --warn: rgba(255,211,110,1);
      --bad: rgba(255,90,103,1);
      --brand: rgba(0,200,255,.95);
    }

    /* ✅ Badge conexión (igual que funcionario) */
    .db-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      color: rgba(255,255,255,.88);
      font-weight:900;
      font-size:12px;
      user-select:none;
      white-space:nowrap;
      backdrop-filter: blur(8px);
    }
    .db-dot{
      width:10px; height:10px;
      border-radius:999px;
      background: rgba(255,255,255,.35);
      box-shadow: 0 0 0 3px rgba(255,255,255,.08);
    }
    /* estados opcionales si tu app.js agrega clases */
    .db-dot.ok{ background: var(--ok); box-shadow:0 0 0 3px rgba(43,213,118,.16); }
    .db-dot.bad{ background: var(--bad); box-shadow:0 0 0 3px rgba(255,90,103,.16); }
    .db-dot.pending{
      background: rgba(255,255,255,.35);
      box-shadow:0 0 0 3px rgba(255,255,255,.08);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse{
      0%{ transform:scale(1); opacity:.8; }
      50%{ transform:scale(1.15); opacity:1; }
      100%{ transform:scale(1); opacity:.8; }
    }

    /* ---------- Top spacing helper ---------- */
    .sp12{ height:12px; }
    .sp16{ height:16px; }
    .sp18{ height:18px; }
    .sp22{ height:22px; }

    /* ---------- Banner Plan ---------- */
    .planBanner{
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.22));
      border-radius:18px;
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      overflow:hidden;
      position:relative;
    }
    .planBanner::before{
      content:"";
      position:absolute;
      inset:-1px;
      background: radial-gradient(800px 220px at 15% 0%, rgba(0,200,255,.18), transparent 60%),
                  radial-gradient(800px 220px at 85% 100%, rgba(120,0,255,.12), transparent 60%);
      pointer-events:none;
      opacity:.9;
    }
    .planBanner > *{ position:relative; }

    .planLeft{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }
    .planTitleRow{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .planTitle{
      font-weight:1000;
      letter-spacing:.6px;
      text-transform:uppercase;
      font-size:12px;
      color: var(--mut);
    }
    .planBig{
      font-weight:1000;
      font-size:18px;
      color:#fff;
      line-height:1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }
    .planSmall{
      color: var(--mut2);
      font-size:13px;
      line-height:1.35;
    }
    .planCTA{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      min-width: 210px;
    }
    .ctaBtn{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      padding:10px 12px;
      border-radius:12px;
      font-weight:900;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }
    .ctaBtn:hover{ background: rgba(255,255,255,.09); }
    .ctaBtn:active{ transform: translateY(1px); }

    .statusPill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.30);
      font-weight:900;
      font-size:12px;
      color: rgba(255,255,255,.90);
      white-space:nowrap;
    }
    .dot{
      width:10px;height:10px;border-radius:999px;
      background: rgba(255,255,255,.35);
      box-shadow: 0 0 0 3px rgba(255,255,255,.08);
    }
    .stOk{ border-color: rgba(43,213,118,.30); background: rgba(43,213,118,.10); }
    .stOk .dot{ background: rgba(43,213,118,1); box-shadow: 0 0 0 3px rgba(43,213,118,.16); }
    .stWarn{ border-color: rgba(255,211,110,.30); background: rgba(255,211,110,.10); }
    .stWarn .dot{ background: rgba(255,211,110,1); box-shadow: 0 0 0 3px rgba(255,211,110,.16); }
    .stBad{ border-color: rgba(255,90,103,.30); background: rgba(255,90,103,.10); }
    .stBad .dot{ background: rgba(255,90,103,1); box-shadow: 0 0 0 3px rgba(255,90,103,.16); }

    /* ---------- KPI improvements ---------- */
    .kpi .box b{
      display:block;
      font-size:18px;
      margin-top:4px;
    }
    .kpiSub{
      color: var(--mut);
      font-size:13px;
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:4px;
    }
    .kpiSub .kIco{
      width:22px;height:22px;
      border-radius:9px;
      display:grid;place-items:center;
      background: rgba(0,200,255,.10);
      border:1px solid rgba(0,200,255,.20);
      color:#baf2ff;
      font-weight:1000;
      font-size:12px;
      flex: 0 0 auto;
    }

    /* ---------- Today Card ---------- */
    .todayCard{
      border:1px solid rgba(0,200,255,.22);
      background: radial-gradient(700px 260px at 20% 0%, rgba(0,200,255,.18), transparent 60%),
                  rgba(0,0,0,.20);
      border-radius:18px;
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      overflow:hidden;
    }
    .todayLeft{ display:flex; flex-direction:column; gap:6px; min-width:0; }
    .todayTitle{
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      font-weight:1000;
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:.6px;
      color: rgba(255,255,255,.92);
    }
    .todayTitle .flame{
      width:26px;height:26px;border-radius:10px;
      display:grid;place-items:center;
      background: rgba(255,120,0,.14);
      border:1px solid rgba(255,120,0,.22);
    }
    .todayMain{
      font-weight:1000;
      font-size:16px;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }
    .todayMeta{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      color: var(--mut2);
      font-size:13px;
    }
    .miniPill{
      display:inline-flex; align-items:center; gap:8px;
      padding:7px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.28);
      font-weight:900;
      font-size:12px;
      color: rgba(255,255,255,.90);
    }
    .miniPill .mIco{
      width:20px;height:20px;border-radius:999px;
      display:grid;place-items:center;
      background: rgba(0,200,255,.10);
      border:1px solid rgba(0,200,255,.18);
      color:#baf2ff;
      font-weight:1000;
      font-size:12px;
    }

    /* ---------- Day accordion (improved) ---------- */
    details.day{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.28);
      border-radius: 16px;
      overflow:hidden;
      margin-top:12px;
      transition: border-color .2s ease, background .2s ease;
    }
    details.day[open]{
      border-color: rgba(0,200,255,.22);
      background: rgba(0,0,0,.32);
    }
    summary.daySum{
      list-style:none;
      cursor:pointer;
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      user-select:none;
    }
    summary.daySum::-webkit-details-marker{ display:none; }
    .dayLeft{ display:flex; flex-direction:column; gap:6px; min-width:0; }
    .dayLeft b{
      font-size:13px;
      letter-spacing:.6px;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }
    .dayLeft .sub{
      font-size:12px;
      color: rgba(255,255,255,.68);
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .chev{
      width:36px;height:36px;
      border-radius:12px;
      display:grid;place-items:center;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color: rgba(255,255,255,.85);
      font-weight:900;
      transition: transform .25s ease;
      flex: 0 0 auto;
    }
    details[open] .chev{ transform: rotate(180deg); }

    .dayBody{ padding:14px 14px 16px; border-top:1px solid rgba(255,255,255,.08); }

    /* ---------- Progress bar per day ---------- */
    .progressRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
      color: rgba(255,255,255,.82);
      font-size:12px;
    }
    .bar{
      flex:1;
      height:10px;
      border-radius:999px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      overflow:hidden;
    }
    .bar > i{
      display:block;
      height:100%;
      width:0%;
      background: rgba(0,200,255,.55);
      border-right:1px solid rgba(0,200,255,.18);
      transition: width .25s ease;
    }
    .progressTxt{
      min-width: 120px;
      text-align:right;
      color: rgba(255,255,255,.78);
      font-weight:900;
    }

    /* ---------- Exercise card ---------- */
    .exCard{
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      padding:14px;
      margin-top:12px;
      display:flex;
      gap:14px;
      align-items:flex-start;
      transition: border-color .2s ease, background .2s ease, transform .08s ease;
    }
    .exCard:active{ transform: translateY(1px); }
    .exMain{ flex:1; min-width:0; }
    .exTitle{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .muscleTag{
      display:inline-flex;
      gap:8px;
      align-items:center;
      font-weight:1000;
      letter-spacing:.6px;
      text-transform:uppercase;
      color: rgba(255,255,255,.92);
    }
    .muscleTag .icon{
      width:22px;height:22px;
      border-radius:8px;
      display:grid;place-items:center;
      background: rgba(0,200,255,.14);
      border:1px solid rgba(0,200,255,.25);
      color:#aeefff;
      font-weight:1000;
    }
    .exerciseName{
      font-weight:1000;
      font-size:15px;
      color:#fff;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width: 100%;
    }

    .chips{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.30);
      color: rgba(255,255,255,.88);
      font-weight:900;
      font-size:13px;
    }
    .chip .cIcon{
      width:22px;height:22px;
      border-radius:999px;
      display:grid;place-items:center;
      background: rgba(0,200,255,.12);
      border:1px solid rgba(0,200,255,.22);
      color:#baf2ff;
      font-size:12px;
      font-weight:1000;
    }

    .note{
      display:flex;
      gap:10px;
      align-items:flex-start;
      color: rgba(255,255,255,.78);
      font-size:13px;
      line-height:1.4;
      white-space:pre-wrap;
    }
    .note .bubble{
      width:28px;height:28px;
      border-radius:10px;
      display:grid;place-items:center;
      background: rgba(242,196,0,.10);
      border:1px solid rgba(242,196,0,.22);
      color:#ffe7a1;
      font-weight:1000;
    }

    .exDone{
      display:flex;
      align-items:center;
      justify-content:center;
      width:54px;
      padding-top:6px;
    }
    .exDone input{
      width:24px;height:24px;
      accent-color: var(--brand);
      cursor:pointer;
    }

    /* Completed state */
    .exCard.done{
      border-color: rgba(43,213,118,.30);
      background: rgba(43,213,118,.07);
    }
    .exCard.done .exerciseName,
    .exCard.done .muscleTag{ opacity:.92; }
    .exCard.done .chips,
    .exCard.done .note{ opacity:.72; }

    .doneBadge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(43,213,118,.28);
      background: rgba(43,213,118,.10);
      color: rgba(220,255,235,.95);
      font-weight:1000;
      font-size:12px;
      margin-left:auto;
    }

    /* ---------- Meta line (plan pill) ---------- */
    .metaLine{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      color: rgba(255,255,255,.72);
      font-size:12px;
      margin-bottom:10px;
    }

    /* ---------- Paywall ---------- */
    .paywall{
      border:1px solid rgba(255,90,103,.35);
      background: rgba(255,90,103,.10);
      border-radius:16px;
      padding:16px;
      margin-top:14px;
      color: rgba(255,255,255,.92);
    }
    .paywall b{ font-size:16px; }
    .paywall .sub{
      margin-top:6px;
      color: rgba(255,255,255,.78);
      line-height:1.4;
    }

    /* Plan pill coloring */
    .planPill{ font-weight: 1000 !important; border-width: 1px !important; }
    .planOk{
      background: rgba(43,213,118,.12) !important;
      border-color: rgba(43,213,118,.35) !important;
      color: rgba(220,255,235,.95) !important;
    }
    .planWarn{
      background: rgba(255,211,110,.12) !important;
      border-color: rgba(255,211,110,.35) !important;
      color: rgba(255,244,210,.95) !important;
    }
    .planBad{
      background: rgba(255,90,103,.12) !important;
      border-color: rgba(255,90,103,.35) !important;
      color: rgba(255,230,233,.95) !important;
    }

    /* ---------- Mobile tweaks ---------- */
    @media (max-width: 700px){
      .planCTA{ min-width: 0; justify-content:flex-start; }
      .planBanner{ flex-direction:column; align-items:stretch; }
      .todayCard{ flex-direction:column; align-items:stretch; }
      .progressTxt{ min-width: 0; text-align:left; }
      .exDone{ width:48px; }
      .exCard{ padding:12px; }
      .exerciseName{ white-space:normal; }
      .chips .chip{ font-size:12px; }
    }
  </style>
</head>

<body data-page="socio">
  <header class="topbar">
    <div class="brand"><span class="mah">MAH</span> <span class="fit">FIT</span></div>

    <div class="nav-right" style="gap:10px; flex-wrap:wrap;">
      <!-- ✅ Conexión (NUEVO) -->
      <span class="db-badge">
        <span id="dbDot" class="db-dot pending"></span>
        <span id="dbText">Conectando...</span>
      </span>

      <span>Hola, <b id="who"></b></span>
      <span id="roleBadge" class="badge"></span>
      <button id="btnLogout" class="btn ghost small">Salir</button>
    </div>
  </header>

  <main class="hero">
    <div class="container">

      <!-- ✅ Banner Plan -->

            <span>💬</span><span>Hablar por WhatsApp</span>

          <button id="btnGoToday" class="ctaBtn" type="button" style="display:none;">

      <div class="kpi">
        <div class="box">
          <div style="color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;">Plan</div>
          <b id="kPlan">-</b>

            <span class="kIco">🏷</span><span id="kNivel">(sin rutina)</span>
          </div>
        </div>

        <div class="box">
          <div style="color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;">Cardio semanal</div>
          <b id="kCardio">-</b>
          <div class="kpiSub">
            <span class="kIco">🫀</span><span id="kCardio2">-</span>
          </div>
        </div>

        <div class="box">
          <div style="color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;">Rutina semanal</div>
          <b id="kDias">0</b>
          <div class="kpiSub">
            <span class="kIco">🗓</span><span>día(s) de entrenamiento</span>

      <!-- ✅ Entrenamiento de hoy -->
      <div id="todayCard" class="todayCard" style="display:none;">

          <div id="todayMain" class="todayMain">-</div>
          <div class="todayMeta">
            <span id="todayMuscle" class="miniPill"><span class="mIco">🏋️</span><span>-</span></span>

          </div>

          <button id="btnOpenToday" class="ctaBtn" type="button"><span>✅</span><span>Ver rutina</span></button>
        </div>
      </div>

      <div class="sp18"></div>

      <div class="card">
        <div class="head">
          <strong>Tu plan de entrenamiento</strong>
          <span class="pill">Por día (desplegable)</span>
        </div>
        <div class="body" id="rutinaBox"></div>
      </div>

    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    function safe(v, fallback="-"){
      return (v===undefined || v===null || String(v).trim()==="") ? fallback : String(v);
    }

    // ✅ calcula días restantes del plan (usa user.planFin)
    function planInfo(planFin){
      if(!planFin) return { status:"none", days:null, endTxt:"", label:"Sin plan" };

      const end = new Date(planFin);
      if(isNaN(end.getTime())) return { status:"none", days:null, endTxt:"", label:"Sin plan" };

      end.setHours(0,0,0,0);
      const today = new Date();
      today.setHours(0,0,0,0);

      const diff = Math.ceil((end.getTime() - today.getTime()) / (1000*60*60*24));
      const endTxt = end.toLocaleDateString("es-CL");

      if(diff < 0) return { status:"expired", days:diff, endTxt, label:`Vencido (vence ${endTxt})` };
      if(diff === 0) return { status:"today", days:0, endTxt, label:`Vence hoy (${endTxt})` };
      return { status:"active", days:diff, endTxt, label:`Quedan ${diff} días (vence ${endTxt})` };
    }

    function planClass(status, days){
      if(status === "active"){
        if(typeof days === "number" && days <= 5) return "planWarn";
        return "planOk";
      }
      if(status === "today") return "planWarn";
      return "planBad";
    }

    function statusPillClass(status, days){
      if(status === "active"){
        if(typeof days === "number" && days <= 5) return "stWarn";
        return "stOk";
      }
      if(status === "today") return "stWarn";
      return "stBad";
    }

    function getDoneKey(rut, day, idx){
      return `mahfit_done_${rut}_${day}_${idx}`;
    }

    function getDayProgress(rutSocio, day){
      const ejercicios = Array.isArray(day.ejercicios) ? day.ejercicios : [];
      const total = ejercicios.length;
      let done = 0;
      ejercicios.forEach((e, i)=>{
        const k = getDoneKey(rutSocio, day.dia, i);
        if(localStorage.getItem(k) === "1") done++;
      });
      const pct = total ? Math.round((done/total)*100) : 0;
      return { total, done, pct };
    }

    function renderDay(day, rutSocio){
      const enfoque = Array.isArray(day.enfoque) ? day.enfoque.join(" + ") : safe(day.enfoque, "Full Body");
      const ejercicios = Array.isArray(day.ejercicios) ? day.ejercicios : [];
      const total = ejercicios.length;

      const prog = getDayProgress(rutSocio, day);

      const cards = ejercicios.map((e, i)=>{
        const doneKey = getDoneKey(rutSocio, day.dia, i);
        const checked = localStorage.getItem(doneKey) === "1" ? "checked" : "";

        const chipSeries = safe(e.series, "-");
        const chipReps   = safe(e.reps, "-");
        const chipCarga  = safe(e.carga, "-");
        const chipDesc   = safe(e.descanso, "-");
        const noteText = safe(e.obs, "");

        return `
          <div class="exCard ${checked ? "done" : ""}" data-excard="${doneKey}">
            <div class="exMain">
              <div class="exTitle">
                <span class="muscleTag"><span class="icon">🏋️</span>${safe(e.musculo,"Músculo")}</span>
                <span class="exerciseName">${safe(e.ejercicio,"Ejercicio")}</span>
                ${checked ? `<span class="doneBadge">✓ Hecho</span>` : ``}
              </div>

              <div class="chips">
                <span class="chip"><span class="cIcon">≡</span>${chipSeries} series</span>
                <span class="chip"><span class="cIcon">↻</span>${chipReps}</span>
                <span class="chip"><span class="cIcon">⚖</span>${chipCarga}</span>
                <span class="chip"><span class="cIcon">⏱</span>${chipDesc}</span>
              </div>

              ${noteText && noteText !== "-" ? `
                <div class="note">
                  <div class="bubble">💬</div>
                  <div>${noteText}</div>
                </div>
              ` : ``}
            </div>

            <div class="exDone">
              <input type="checkbox" ${checked} data-done="${doneKey}" data-day="${safe(day.dia)}" data-idx="${i}">
            </div>
          </div>
        `;
      }).join("");

      return `
        <details class="day" data-day="${safe(day.dia)}">
          <summary class="daySum">
            <div class="dayLeft">
              <b>${safe(day.dia)}</b>
              <div class="sub">
                Enfocado: <span class="pill">${enfoque}</span>
                · Ejercicios: <span class="pill">${total}</span>
                ${total ? `· <span class="pill">${prog.pct}%</span>` : ``}
              </div>
            </div>
            <div class="chev">⌄</div>
          </summary>
          <div class="dayBody">
            ${total ? `
              <div class="progressRow">
                <div class="bar" aria-label="Progreso"><i style="width:${prog.pct}%"></i></div>
                <div class="progressTxt"><span data-prog="${safe(day.dia)}">${prog.done} de ${prog.total} ✓</span></div>
              </div>
              ${cards}
            ` : `<div class="notice"><b>Aún no hay ejercicios</b><br>Este día todavía no tiene ejercicios cargados 💪</div>`}
          </div>
        </details>
      `;
    }

    function pickTodayIndex(nDias){
      if(!nDias || nDias <= 0) return 0;
      const dow = new Date().getDay(); // 0 dom ... 6 sáb
      const map = (dow === 0) ? 6 : (dow - 1); // 0=lun ... 6=dom
      return map % nDias;
    }

    function openOnly(detailsEl){
      document.querySelectorAll("details.day[open]").forEach(d=>{
        if(d !== detailsEl) d.removeAttribute("open");
      });
    }

    function scrollToEl(el){
      if(!el) return;
      el.scrollIntoView({ behavior:"smooth", block:"start" });
    }

    function buildWhatsLink(user){
      const phone = "56900000000";
      const msg = `Hola! Soy ${safe(user.nombre,"")} (RUT: ${safe(user.rut,"")}). Quiero revisar mi plan en MAH FIT.`;
      return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    }

    document.addEventListener("DOMContentLoaded", ()=>{
      // ✅ Tip: si tu app.js ya actualiza dbDot/dbText, esto se verá reflejado solo.
      // Dejar el "pending" por defecto ayuda a que se vea "Conectando..." apenas abre.

      const user = requireAuth("SOCIO");
      if(!user) return;

      document.querySelector("#who").textContent = user.nombre;
      document.querySelector("#roleBadge").textContent = "SOCIO";

      const btnWhats = document.querySelector("#btnWhats");
      btnWhats.href = buildWhatsLink(user);

      const box = document.querySelector("#rutinaBox");

      const p = planInfo(user.planFin);

      const planBanner = document.querySelector("#planBanner");
      const planStatusPill = document.querySelector("#planStatusPill");
      const planBig = document.querySelector("#planBig");
      const planSmall = document.querySelector("#planSmall");
      const btnGoToday = document.querySelector("#btnGoToday");

      planBanner.style.display = "flex";
      planStatusPill.className = "statusPill " + statusPillClass(p.status, p.days);

      const kPlan = document.querySelector("#kPlan");

      if(p.status === "active"){
        kPlan.textContent = `Activo · ${p.days} día(s)`;
        kPlan.style.color = (p.days <= 5) ? "var(--warn)" : "var(--ok)";

        planStatusPill.querySelector("span:last-child").textContent = "ACTIVO";
        planBig.textContent = `Te quedan ${p.days} día(s)`;
        planSmall.textContent = `Vence el ${p.endTxt}. Mantén constancia y a darle 🔥`;
      }else if(p.status === "today"){
        kPlan.textContent = "Vence hoy";
        kPlan.style.color = "var(--warn)";

        planStatusPill.querySelector("span:last-child").textContent = "ÚLTIMO DÍA";
        planBig.textContent = "Tu plan vence hoy";
        planSmall.textContent = `Vence el ${p.endTxt}. Si quieres seguir entrenando, solicita renovación ✅`;
      }else{
        kPlan.textContent = "Inactivo";
        kPlan.style.color = "var(--bad)";

        planStatusPill.querySelector("span:last-child").textContent = "INACTIVO";
        planBig.textContent = "Tu plan está inactivo 😕";
        planSmall.textContent = "Renueva tu plan para disfrutar tus entrenamientos y asesorías.";
      }

      if(p.status !== "active" && p.status !== "today"){
        document.querySelector("#kNivel").textContent = "Renueva tu plan";
        document.querySelector("#kDias").textContent = "0";
        document.querySelector("#kCardio").textContent = "-";
        document.querySelector("#kCardio2").textContent = "—";
        document.querySelector("#todayCard").style.display = "none";

        box.innerHTML = `
          <div class="paywall">
            <b>Renueva tu plan para disfrutar tus entrenamientos y asesorías</b>
            <div class="sub">
              Tu membresía está <b>inactiva</b>. Para reactivar tu acceso, solicita la renovación con administración.
            </div>
          </div>
        `;
        return;
      }

      const rv2 = rutinaV2DeSocio(user.rut);
      if(!rv2 || !rv2.routine){
        document.querySelector("#kNivel").textContent = "(sin rutina)";
        document.querySelector("#kDias").textContent = "0";
        document.querySelector("#kCardio").textContent = "-";
        document.querySelector("#kCardio2").textContent = "—";
        document.querySelector("#todayCard").style.display = "none";

        box.innerHTML = `
          <div class="notice">
            <b>Aún no tienes rutina asignada</b><br>
            Tu plan está activo, pero todavía no se te asigna una rutina específica. Escríbenos y la dejamos lista 💪
          </div>
        `;
      }else{
        const routine = rv2.routine;
        const meta = routine.meta || {};
        const cardio = meta.cardio || {};

        document.querySelector("#kNivel").textContent = safe(meta.nivel, "(sin nivel)");

        const dias = Array.isArray(routine.dias) ? routine.dias.slice() : [];
        dias.sort((a,b)=>{
          const na = parseInt(String(a.dia||"").replaceAll(/\D/g,"")) || 0;
          const nb = parseInt(String(b.dia||"").replaceAll(/\D/g,"")) || 0;
          return na-nb;
        });

        const nDias = (dias||[]).length || 0;
        document.querySelector("#kDias").textContent = String(nDias);

        const cTipo = safe(cardio.tipo, "-");
        const cMin  = safe(cardio.min, "-");
        const cFreq = safe(cardio.freq, "-");
        document.querySelector("#kCardio").textContent = (cTipo === "-" ? "-" : cTipo);
        document.querySelector("#kCardio2").textContent =
          (cMin === "-" && cFreq === "-") ? "—" : `${cMin} min · ${cFreq} veces`;

        const todayCard = document.querySelector("#todayCard");
        const idxToday = pickTodayIndex(nDias);
        const dayToday = dias[idxToday] || dias[0];

        if(dayToday){
          const enfoque = Array.isArray(dayToday.enfoque) ? dayToday.enfoque.join(" + ") : safe(dayToday.enfoque, "Full Body");
          const ejercicios = Array.isArray(dayToday.ejercicios) ? dayToday.ejercicios : [];

          document.querySelector("#todayMain").textContent = `${safe(dayToday.dia)} · ${enfoque}`;
          document.querySelector("#todayMuscle").querySelector("span:last-child").textContent = enfoque;
          document.querySelector("#todayCount").querySelector("span:last-child").textContent = `${ejercicios.length} ejercicio(s)`;

          todayCard.style.display = "flex";
          btnGoToday.style.display = "inline-flex";

          const go = ()=>{
            const det = document.querySelector(`details.day[data-day="${CSS.escape(safe(dayToday.dia))}"]`);
            if(det){
              det.setAttribute("open", "");
              openOnly(det);
              scrollToEl(det);
            }
          };
          document.querySelector("#btnOpenToday").addEventListener("click", go);
          btnGoToday.addEventListener("click", go);
        }else{
          todayCard.style.display = "none";
          btnGoToday.style.display = "none";
        }

        box.innerHTML = `
          <div class="metaLine">
            <span class="pill planPill ${planClass(p.status, p.days)}">Plan: ${p.label}</span>
            <span class="pill">Tu objetivo: ${safe(meta.objetivo,"-")}</span>
            <span class="pill">Actualizado: ${safe(meta.fecha,"-")}</span>
          </div>
          ${dias.map(d=>renderDay(d, user.rut)).join("")}
        `;

        box.querySelectorAll("details.day").forEach(det=>{
          det.addEventListener("toggle", ()=>{
            if(det.open) openOnly(det);
          });
        });

        box.querySelectorAll('[data-done]').forEach(chk=>{
          chk.addEventListener("change", ()=>{
            const key = chk.getAttribute("data-done");
            const dayName = chk.getAttribute("data-day");
            localStorage.setItem(key, chk.checked ? "1" : "0");

            const card = box.querySelector(`[data-excard="${CSS.escape(key)}"]`);
            if(card){
              card.classList.toggle("done", chk.checked);
              const titleRow = card.querySelector(".exTitle");
              const existing = card.querySelector(".doneBadge");
              if(chk.checked && !existing){
                const b = document.createElement("span");
                b.className = "doneBadge";
                b.textContent = "✓ Hecho";
                titleRow.appendChild(b);
              }
              if(!chk.checked && existing) existing.remove();
            }

            const det = box.querySelector(`details.day[data-day="${CSS.escape(dayName)}"]`);
            if(det){
              const dayObj = dias.find(x => safe(x.dia) === safe(dayName));
              if(dayObj){
                const prog = getDayProgress(user.rut, dayObj);
                const barI = det.querySelector(".bar > i");
                if(barI) barI.style.width = prog.pct + "%";
                const txt = det.querySelector(`[data-prog="${CSS.escape(dayName)}"]`);
                if(txt) txt.textContent = `${prog.done} de ${prog.total} ✓`;

                const sub = det.querySelector(".dayLeft .sub");
                if(sub){
                  const pills = sub.querySelectorAll(".pill");
                  const last = pills[pills.length - 1];
                  if(last && last.textContent.includes("%")){
                    last.textContent = `${prog.pct}%`;
                  }else if(prog.total){
                    const pEl = document.createElement("span");
                    pEl.className = "pill";
                    pEl.textContent = `${prog.pct}%`;
                    sub.appendChild(document.createTextNode(" · "));
                    sub.appendChild(pEl);
                  }
                }
              }
            }
          });
        });
      }

      document.querySelector("#btnLogout").addEventListener("click", ()=>{
        clearSession();
        window.location.href = "index.html";
      });
    });
  </script>
</body>
</html>
